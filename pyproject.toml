[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizuki-herenow-remote"
version = "0.1.0"
description = "Read and update files in owned here.now sites through MCP"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
mcp = ["mcp==2.0.0", "PyJWT[crypto]>=2.10,<3", "uvicorn>=0.31,<1"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
herenow-remote = "here_now_remote.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_mcp_integration.py" = ["E402"]
